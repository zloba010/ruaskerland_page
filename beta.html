        <script>
            window.addEventListener("load", (event) => {
                let bg = localStorage.getItem("selectedBG");
                if(bg){
                    setBG(bg);
                }
                else{
                    setBG("bg1");
                }
 
                if(sbg){
                    sbg.addEventListener('change', (event) => {
                        localStorage.setItem("selectedBG", event.target.value);
                        setBG(event.target.value);
                    });
                }
            });
          
            function setBG(bgi){
                css = document.body.className;
                cssBg = css.split(" ").pop();
                document.body.className = document.body.className.replace(cssBg, bgi);
            }
